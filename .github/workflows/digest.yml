name: Riassunto AI quotidiano

on:
  schedule:
    # Due scansioni al giorno (orari UTC). Se li cambi, cambia anche ORARI_UTC in digest.py.
    - cron: "17 5 * * *"    # edizione del mattino: 07:17 con l'ora legale, 06:17 con l'ora solare
    - cron: "17 16 * * *"   # aggiornamento: 18:17 con l'ora legale, 17:17 con l'ora solare
  workflow_dispatch:
    inputs:
      settimana:
        description: "Crea anche l'edizione 'La settimana dell'AI' (1 = sì)"
        required: false
        default: "0"

permissions:
  contents: write
  issues: write
  pages: read        # per sapere da quale ramo è pubblicato il sito

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AVVISI_FILE: ${{ github.workspace }}/../avvisi.txt
    steps:
      - uses: actions/checkout@v5

      # Gli MP3 vivono nel ramo gh-pages (ricostruito da zero a ogni pubblicazione, senza storia),
      # così la storia di main non cresce di ~1 MB al giorno.
      - name: Recupera l'audio già pubblicato
        run: |
          if git fetch -q --depth=1 origin gh-pages 2>/dev/null; then
            mkdir -p docs/audio
            git archive FETCH_HEAD audio 2>/dev/null | tar -x -C docs --wildcards 'audio/*.mp3' 2>/dev/null || true
            echo "Audio recuperati: $(ls docs/audio/*.mp3 2>/dev/null | wc -l)"
          else
            echo "Ramo gh-pages non ancora creato: si usano gli audio presenti in main."
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installa gli strumenti
        run: |
          sudo locale-gen it_IT.UTF-8 || true
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q trafilatura googlenewsdecoder || echo "Librerie facoltative non installate: si usa la riserva."

      - name: Controlla che gli script siano completi
        run: |
          for f in digest.py tools/audio.py; do
            python -m py_compile "$f" || { echo "❌ $f non è valido: ricaricalo per intero."; exit 1; }
            tail -15 "$f" | grep -q "main()" || { echo "❌ $f è incompleto: ricaricalo per intero."; exit 1; }
          done

      - name: Cache della voce Paola
        uses: actions/cache@v5
        with:
          path: ~/.cache/ai-news-tts
          key: paola-tts-1.12.14

      - name: Genera il riassunto
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SETTIMANA: ${{ github.event.inputs.settimana }}
        run: python digest.py

      - name: Crea l'audio con la voce Paola
        continue-on-error: true
        run: python tools/audio.py

      - name: Aggiorna le pagine con l'audio
        run: python digest.py --pagine

      - name: Pubblica
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "ai-news-bot"
          git config --global user.email "ai-news-bot@users.noreply.github.com"

          # 0) fotografia del sito completo (con gli MP3) prima di toccare main
          SITE=$(mktemp -d)
          cp -a docs/. "$SITE"/
          touch "$SITE/.nojekyll"
          echo "Fotografia del sito: $(ls "$SITE"/audio/*.mp3 2>/dev/null | wc -l) audio"

          # 1) ramo main: pagine e dati. Gli MP3 restano in main solo finché
          #    il sito non è servito dal ramo gh-pages (Settings > Pages).
          SOURCE=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.source.branch' 2>/dev/null || echo "?")
          echo "Il sito è pubblicato dal ramo: $SOURCE"
          if [ "$SOURCE" = "gh-pages" ]; then
            grep -qx 'docs/audio/\*.mp3' .gitignore 2>/dev/null || echo 'docs/audio/*.mp3' >> .gitignore
            git rm -r -q --cached --ignore-unmatch 'docs/audio/*.mp3'
            git add .gitignore
          fi
          git add docs
          if git diff --cached --quiet; then
            echo "Nessuna novità in main."
          else
            git commit -m "Riassunto del $(TZ=Europe/Rome date '+%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi

          # 2) ramo gh-pages: il sito completo con gli MP3, in un solo commit senza storia
          cd "$SITE"
          git init -q -b gh-pages
          git add -A -f
          git commit -q -m "Sito pubblicato $(TZ=Europe/Rome date '+%Y-%m-%d %H:%M')"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "✅ Sito pubblicato su gh-pages ($(du -sh . | cut -f1))"

      - name: Notifica sul telefono (ntfy)
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SENTINELLE: ${{ secrets.SENTINELLE }}
        run: |
          [ -n "$NTFY_TOPIC" ] || { echo "Segreto NTFY_TOPIC non impostato: nessuna notifica."; exit 0; }
          sleep 75   # il tempo che GitHub Pages pubblichi la pagina nuova
          python digest.py --notifica

      - name: Avvisami se qualcosa non va
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          F="$AVVISI_FILE"
          touch "$F"
          if [ "${{ job.status }}" != "success" ]; then
            echo "- L'aggiornamento automatico si è interrotto con un errore." >> "$F"
          fi
          [ -s "$F" ] || { echo "Tutto regolare."; exit 0; }
          echo "" >> "$F"
          echo "Dettagli dell'esecuzione: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$F"
          cat "$F"
          gh issue create --title "⚠️ AI News Digest: problema del $(TZ=Europe/Rome date +%d/%m/%Y)" --body-file "$F" \
            || echo "Impossibile aprire la segnalazione (le Issues del repository sono attive?)"
